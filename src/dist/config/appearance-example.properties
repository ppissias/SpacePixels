# Optional desktop appearance overrides. Copy this file somewhere writable,
# edit it, select it on the Appearance tab, save and restart SpacePixels.
# Unspecified values come from the selected built-in theme.
# This example is intended for Dark or High contrast dark.
# UTF-8; relative file paths are resolved in your home folder.

# Near-black surfaces with bright text.
@background = #101010
@foreground = #ffffff

# Readable help and link text.
SpacePixels.helpForeground = #ffffff
SpacePixels.linkForeground = #8ecbff

# Clear borders and selections.
Component.borderColor = #aaaaaa
Button.borderColor = #aaaaaa
@selectionBackground = #005ea6
@selectionForeground = #ffffff

# Optional font example (uncomment to try a specific family and size).
# The Appearance interface-size percentage is applied in addition.
# defaultFont = 18 "SansSerif"
