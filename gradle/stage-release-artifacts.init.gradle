allprojects {
    tasks.withType(Jar).configureEach {
        destinationDirectory = layout.buildDirectory.dir('release-validation-libs')
    }
    plugins.withId('maven-publish') {
        publishing.repositories.maven {
            name = 'releaseValidation'
            url = uri(providers.gradleProperty('releaseValidationRepository').get())
        }
    }
}
