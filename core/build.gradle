plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = rootProject.group
version = rootProject.version
description = 'Headless SpacePixels Java API, FITS preparation, detection orchestration and report generation.'

repositories {
    mavenCentral()
}

base {
    archivesName = 'spacepixels-core'
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addBooleanOption('html5', true)
    options.addStringOption('Xdoclint:none', '-quiet')
}

sourceSets.main {
    java {
        srcDirs = [rootProject.file('src/main/java')]
        include 'eu/startales/spacepixels/api/**', 'eu/startales/spacepixels/config/**',
                'eu/startales/spacepixels/session/**', 'eu/startales/spacepixels/util/**'
    }
    resources {
        srcDirs = [rootProject.file('src/main/resources')]
        include 'spacepixels-build.properties', 'eu/startales/spacepixels/util/**'
    }
}

dependencies {
    api 'io.github.ppissias.jtransient:jtransient:1.0.5'
    implementation 'gov.nasa.gsfc.heasarc:nom-tam-fits:1.21.2'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'io.github.ppissias.jplatesolve:jplatesolve:1.0.1'
}

tasks.named('processResources') {
    def appVersion = project.version.toString()
    def runtimeClasspath = configurations.runtimeClasspath
    def engineVersion = providers.provider {
        runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .find { it.moduleVersion.id.group == 'io.github.ppissias.jtransient' }?.moduleVersion?.id?.version ?: 'local'
    }
    inputs.property('appVersion', appVersion)
    inputs.property('engineVersion', engineVersion)
    filesMatching('spacepixels-build.properties') {
        expand(appVersion: appVersion, engineVersion: engineVersion.get())
    }
}

ext.publicationArtifactId = 'spacepixels-core'
ext.publicationDisplayName = 'SpacePixels Core'
apply from: rootProject.file('gradle/publishing.gradle')
apply from: rootProject.file('gradle/core-artifact.gradle')

tasks.named('check') {
    dependsOn tasks.named('verifyCorePublication')
}

tasks.named('bundleCentralPortal') {
    dependsOn rootProject.tasks.named('check')
}
