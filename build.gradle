 * For more details take a look at the Java Libraries chapter in the Gradle
 * User Manual available at https://docs.gradle.org/6.3/userguide/java_library_plugin.html
 */

plugins {
    id 'java-library'
    id 'application'
    id 'maven-publish'
    id 'signing'
}

def mainLauncherName = 'SpacePixels'
def publicLauncherName = "Start${mainLauncherName}"
def sharedJvmArgs = ["-XX:MaxRAMPercentage=80.0", "-XX:+UseG1GC"]
def batchDetectJvmArgs = sharedJvmArgs + ["-Djava.awt.headless=true"]
def centralArtifactId = 'spacepixels'
repositories {
    mavenCentral()
}
// Add your group and version here
group = 'eu.startales.spacepixels'
version = '2026.11-03'
description = 'Headless SpacePixels Java API and command-line tools for moving and transient object detection in aligned astronomical image sequences.'

base {
    archivesName = centralArtifactId
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    withJavadocJar()
    withSourcesJar()
}

javadoc {
    options.encoding = 'UTF-8'
    if (options.respondsTo('addBooleanOption')) {
        options.addBooleanOption('html5', true)
        options.addBooleanOption('quiet', true)
    }
    if (options.respondsTo('addStringOption')) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

sourceSets {
    main {
        java.include 'eu/startales/spacepixels/api/**', 'eu/startales/spacepixels/config/**',
                'eu/startales/spacepixels/session/**', 'eu/startales/spacepixels/util/**',
                'eu/startales/spacepixels/tools/**', 'eu/startales/spacepixels/fits/**',
                'eu/startales/spacepixels/detection/**', 'eu/startales/spacepixels/platesolve/**',
                'eu/startales/spacepixels/report/**', 'eu/startales/spacepixels/skycatalog/**',
                'eu/startales/spacepixels/solarsystem/**', 'eu/startales/spacepixels/preparation/**'
        resources.include 'spacepixels-build.properties', 'eu/startales/spacepixels/util/**',
                'eu/startales/spacepixels/tools/**', 'eu/startales/spacepixels/report/**'
    }
    desktop {
        java {
            srcDirs = ['src/main/java']
            include 'eu/startales/spacepixels/gui/**', 'eu/startales/spacepixels/jobs/**',
                    'eu/startales/spacepixels/tasks/**'
        }
        resources {
            srcDirs = ['src/main/resources']
            include 'eu/startales/spacepixels/gui/**', 'eu/startales/spacepixels/jobs/**',
                    'eu/startales/spacepixels/tasks/**'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.desktop.output
        runtimeClasspath += sourceSets.desktop.output
    }
}

configurations {
    desktopImplementation.extendsFrom implementation
    desktopRuntimeOnly.extendsFrom runtimeOnly
    testImplementation.extendsFrom desktopImplementation
    testRuntimeOnly.extendsFrom desktopRuntimeOnly
}

// Annotation-only transitives. SpotBugs annotations are LGPL 2.1; none of these jars is
// required at runtime. Exclude them on every edge so distributions and the published POM omit them.
def excludeUnusedAnnotationJars = {
    return {
        exclude group: 'com.github.spotbugs'
        exclude group: 'com.google.code.findbugs'
        exclude group: 'jakarta.annotation'
        exclude group: 'com.google.errorprone'
    }
}

dependencies {
    api('io.github.ppissias.jtransient:jtransient:1.1.0', excludeUnusedAnnotationJars())
    implementation('gov.nasa.gsfc.heasarc:nom-tam-fits:1.23.0', excludeUnusedAnnotationJars())
    implementation('com.google.code.gson:gson:2.14.0', excludeUnusedAnnotationJars())
    implementation('io.github.ppissias.jplatesolve:jplatesolve:1.0.2', excludeUnusedAnnotationJars())
    desktopImplementation 'com.formdev:flatlaf:3.7.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'tokyo.northside:assertj-swing-junit:4.0.0-beta-3'
}

tasks.named('processResources') {
    def appVersion = project.version.toString()
    def runtimeClasspath = configurations.runtimeClasspath
    def engineVersion = providers.provider {
        runtimeClasspath.resolvedConfiguration.resolvedArtifacts
                .find { it.moduleVersion.id.group == 'io.github.ppissias.jtransient' }?.moduleVersion?.id?.version ?: 'local'
    }
    inputs.property('appVersion', appVersion)
    inputs.property('engineVersion', engineVersion)
    filesMatching('spacepixels-build.properties') {
        expand(appVersion: appVersion, engineVersion: engineVersion.get())
    }
}

def desktopJar = tasks.register('desktopJar', Jar) {
    group = 'build'
    description = 'Builds the unpublished desktop companion for the application distribution.'
    archiveClassifier = 'desktop'
    from sourceSets.desktop.output
}

tasks.named('run', JavaExec) {
    classpath = sourceSets.desktop.runtimeClasspath
}

tasks.named('startScripts', CreateStartScripts) {
    classpath = files(tasks.named('jar'), desktopJar) + configurations.desktopRuntimeClasspath
}

application {
    mainClass = 'eu.startales.spacepixels.gui.ApplicationWindow'
    applicationName = mainLauncherName

    // Dynamically allocate up to 80% of the host system's total memory at runtime.
    // This applies to both `./gradlew run` and the generated distribution start scripts.
    applicationDefaultJvmArgs = sharedJvmArgs
}

def registerToolStartScripts = { String taskName, String launcherName, String toolMainClass, List<String> launcherJvmArgs ->
    tasks.register(taskName, CreateStartScripts) {
        applicationName = launcherName
        mainClass = toolMainClass
        classpath = files(tasks.named('jar')) + configurations.runtimeClasspath
        defaultJvmOpts = launcherJvmArgs
        outputDir = layout.buildDirectory.dir("generated-scripts/${launcherName}").get().asFile
    }
}

def injectStarsStartScripts = registerToolStartScripts(
        'injectStarsStartScripts',
        'injectStars',
        'eu.startales.spacepixels.tools.ArtificialStarInjector',
        sharedJvmArgs
)

def batchDetectStartScripts = registerToolStartScripts(
        'batchDetectStartScripts',
        'batchDetect',
        'eu.startales.spacepixels.tools.BatchDetectionCli',
        batchDetectJvmArgs
)

def windowsMainWrapper = file("src/launchers/${publicLauncherName}.bat")
def unixMainWrapper = file("src/launchers/${publicLauncherName}")

distributions {
    main {
        contents {
            from(windowsMainWrapper)
            from(unixMainWrapper) {
                filePermissions {
                    user {
                        read = true
                        write = true
                        execute = true
                    }
                    group {
                        read = true
                        execute = true
                    }
                    other {
                        read = true
                        execute = true
                    }
                }
            }
            from('LICENSE')
            from('NOTICE.txt')
            into('lib') {
                from(desktopJar)
                from(configurations.desktopRuntimeClasspath - configurations.runtimeClasspath)
            }
            into('bin') {
                from(injectStarsStartScripts)
                from(batchDetectStartScripts)
                // The tool scripts must be executable on Linux and macOS, like the main launcher.
                filePermissions {
                    unix('rwxr-xr-x')
                }
            }
        }
    }
}

tasks.register('injectStars', JavaExec) {
    group = 'application'
    description = 'Run the Artificial Star Injector tool. Usage: gradlew injectStars -PinjArgs="<dir> <num> <move> <peak> <fwhm>"'
    mainClass = 'eu.startales.spacepixels.tools.ArtificialStarInjector'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = sharedJvmArgs

    if (project.hasProperty('injArgs')) {
        args org.apache.tools.ant.types.Commandline.translateCommandline(project.getProperty('injArgs'))
    }
}

tasks.register('batchDetect', JavaExec) {
    group = 'application'
    description = 'Run the batch detection CLI. Usage: gradlew batchDetect -PbatchArgs="\\"<fits_dir>\\" \\"<config.json>\\" [--auto-tune balanced]"'
    mainClass = 'eu.startales.spacepixels.tools.BatchDetectionCli'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = batchDetectJvmArgs
    // Opt-in fixed heap, e.g. -PbatchMaxHeap=8g (otherwise up to 80% of RAM)
    if (project.hasProperty('batchMaxHeap')) {
        maxHeapSize = project.property('batchMaxHeap')
    }

    if (project.hasProperty('batchArgs')) {
        args org.apache.tools.ant.types.Commandline.translateCommandline(project.getProperty('batchArgs'))
    }
}

// Opt-in console diagnostics for the app and the tools, e.g. -PspacepixelsDebug (otherwise only problems are printed)
tasks.withType(JavaExec).configureEach {
    if (project.hasProperty('spacepixelsDebug')) {
        systemProperty 'spacepixels.debug', 'true'
    }
}

// Opt-in larger heap for real-data diagnostic tests, e.g. -PtestMaxHeap=6g
tasks.withType(Test).configureEach {
    // Restart tests fork an isolated application host rather than relaunching the Gradle test worker.
    doFirst { systemProperty 'spacepixels.test.classpath', classpath.asPath }
    if (project.hasProperty('testMaxHeap')) {
        maxHeapSize = project.property('testMaxHeap')
    }
}

// The window suite needs a desktop and moves the mouse. Keep it out of an ordinary test run.
tasks.named('test', Test) {
    exclude '**/gui/mechanics/**'
    exclude '**/SpacePixelsRealDataSmokeTest*'
}

tasks.register('guiMechanicsTest', Test) {
    group = 'verification'
    description = 'Drive the SpacePixels window by the visible text of its controls. Needs a desktop and moves the mouse.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/gui/mechanics/**'
    maxParallelForks = 1
    systemProperty 'java.awt.headless', 'false'
    // The tests start from the default preferences and never touch the user's own.
    systemProperty 'java.util.prefs.PreferencesFactory', 'eu.startales.spacepixels.gui.mechanics.MemoryPreferencesFactory'
    // AssertJ Swing's timer monitor reflects on TimerTask state on Java 21.
    jvmArgs '--add-opens=java.base/java.util=ALL-UNNAMED'
    shouldRunAfter tasks.named('test')
    // A previous pass must not skip the window. The point of this task is to open it.
    outputs.upToDateWhen { false }
    testLogging {
        events 'started', 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}

def artifactName = centralArtifactId
def stagingRepository = rootProject.layout.buildDirectory.dir('repos/central-staging')
def inMemorySigningKey = providers.gradleProperty('signingKey').map { it.replace('\\n', '\n') }.orNull
def inMemorySigningPassword = providers.gradleProperty('signingPassword').orNull
def hasInMemorySigning = inMemorySigningKey != null && inMemorySigningPassword != null
def hasLegacySigning = findProperty('signing.keyId') != null && findProperty('signing.password') != null &&
        findProperty('signing.secretKeyRingFile') != null
def signingConfigured = hasInMemorySigning || hasLegacySigning

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = artifactName
            versionMapping {
                usage('java-api') { fromResolutionOf('runtimeClasspath') }
                usage('java-runtime') { fromResolutionResult() }
            }
            pom {
                name = 'SpacePixels API and tools'
                description = project.description
                url = 'https://github.com/ppissias/SpacePixels'
                licenses {
                    license {
                        name = 'BSD 2-Clause License'
                        url = 'https://opensource.org/license/bsd-2-clause/'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = providers.gradleProperty('pomDeveloperId')
                        name = providers.gradleProperty('pomDeveloperName')
                        email = providers.gradleProperty('pomDeveloperEmail')
                        organization = providers.gradleProperty('pomDeveloperOrganization')
                        organizationUrl = providers.gradleProperty('pomDeveloperOrganizationUrl')
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/ppissias/SpacePixels.git'
                    developerConnection = 'scm:git:ssh://git@github.com/ppissias/SpacePixels.git'
                    url = 'https://github.com/ppissias/SpacePixels'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'centralStaging'
            url = stagingRepository
        }
        maven {
            name = 'consumerTest'
            url = rootProject.layout.buildDirectory.dir('repos/consumer-test')
        }
    }
}

tasks.register('validateCentralReleaseConfiguration') {
    group = 'publishing'
    description = 'Checks published library dependencies, signing credentials and developer metadata before Central staging.'
    // A POM built against a local checkout can name a library version that Central does not have.
    def localLibraryBuilds = gradle.includedBuilds.collect { it.name }.findAll { it in ['JTransient', 'JPlateSolve'] }
    doLast {
        if (localLibraryBuilds) {
            throw new GradleException("A Central bundle must be built against published libraries, but ${localLibraryBuilds.join(' and ')} " +
                    'come from local checkouts. Rerun with -PuseLocalJTransientBuild=false -PuseLocalJPlateSolveBuild=false; ' +
                    'if a required library version does not resolve, publish it first.')
        }
        if (!signingConfigured) {
            throw new GradleException('Central bundle generation requires signing credentials. Set signingKey/signingPassword ' +
                    'or signing.keyId/signing.password/signing.secretKeyRingFile.')
        }
        for (String propertyName : ['pomDeveloperId', 'pomDeveloperName', 'pomDeveloperEmail',
                                   'pomDeveloperOrganization', 'pomDeveloperOrganizationUrl']) {
            if (!providers.gradleProperty(propertyName).orNull?.trim()) {
                throw new GradleException("Missing required Gradle property for publication: '${propertyName}'.")
            }
        }
    }
}

signing {
    if (hasInMemorySigning) useInMemoryPgpKeys(inMemorySigningKey, inMemorySigningPassword)
    if (signingConfigured) sign publishing.publications.mavenJava
}

tasks.withType(Sign).configureEach {
    onlyIf('Central staging publication requested') {
        gradle.taskGraph.allTasks.any { task -> task.name in ['publishMavenJavaPublicationToCentralStagingRepository',
                'publishAllPublicationsToCentralStagingRepository', 'bundleCentralPortal'] }
    }
}

tasks.named('publishMavenJavaPublicationToCentralStagingRepository') {
    dependsOn tasks.named('validateCentralReleaseConfiguration')
}

tasks.register('bundleCentralPortal', Zip) {
    group = 'publishing'
    description = 'Builds a signed Central upload bundle locally after the release checks; never uploads it.'
    dependsOn 'releaseCheck', tasks.named('publishMavenJavaPublicationToCentralStagingRepository')
    from(stagingRepository) {
        def artifactDirectory = "${project.group.toString().replace('.', '/')}/${artifactName}/${project.version}"
        for (String extension : ['jar', 'pom', 'module']) {
            for (String classifier : extension == 'jar' ? ['', '-sources', '-javadoc'] : ['']) {
                String artifactPath = "${artifactDirectory}/${artifactName}-${project.version}${classifier}.${extension}"
                include artifactPath, "${artifactPath}.asc"
                for (String checksum : ['md5', 'sha1', 'sha256', 'sha512']) {
                    include "${artifactPath}.${checksum}", "${artifactPath}.asc.${checksum}"
                }
            }
        }
    }
    destinationDirectory = layout.buildDirectory.dir('distributions')
    archiveFileName = "${artifactName}-${project.version}-central-bundle.zip"
}

tasks.register('mavenCentralBundle') {
    group = 'publishing'
    description = 'Standard alias for bundleCentralPortal.'
    dependsOn tasks.named('bundleCentralPortal')
}

apply from: 'gradle/api-artifact.gradle'
apply from: 'gradle/api-consumer.gradle'
apply from: 'gradle/windows-installer.gradle'
apply from: 'gradle/release-check.gradle'

tasks.register('verifyApplicationDistribution') {
    group = 'verification'
    description = 'Checks that application archives ship NOTICE.txt and only the required runtime jars.'
    dependsOn tasks.named('installDist'), tasks.named('distZip'), tasks.named('distTar'), tasks.named('prepareWindowsInput')
    def installDir = tasks.named('installDist').map { it.destinationDir }
    def zipFile = tasks.named('distZip').flatMap { it.archiveFile }
    def tarFile = tasks.named('distTar').flatMap { it.archiveFile }
    def windowsInput = layout.buildDirectory.dir('windows/input')
    def licenseFile = layout.projectDirectory.file('LICENSE')
    def noticeFile = layout.projectDirectory.file('NOTICE.txt')
    inputs.files(licenseFile, noticeFile)
    doLast {
        def normalize = { String text -> text.replace('\r\n', '\n').replace('\r', '\n') }
        def expectedLicense = normalize(licenseFile.asFile.getText('UTF-8'))
        def expectedNotice = normalize(noticeFile.asFile.getText('UTF-8'))
        def jarAllowed = { String name ->
            name ==~ /(?i)(spacepixels|jtransient|jplatesolve|nom-tam-fits|gson|flatlaf)-.+\.jar/
        }
        def forbidden = { String name ->
            def lower = name.toLowerCase(java.util.Locale.ROOT)
            lower.contains('spotbugs') || lower.contains('jakarta') || lower.contains('jsr305')
                    || lower.contains('error_prone') || lower.contains('commons-compress')
        }
        def assertJars = { Collection<String> names, String where ->
            def jars = names.findAll { it.toLowerCase(java.util.Locale.ROOT).endsWith('.jar') }
            def bad = jars.findAll { forbidden(it) || !jarAllowed(it) }
            def missing = ['spacepixels', 'jtransient', 'jplatesolve', 'nom-tam-fits', 'gson', 'flatlaf'].findAll { stem ->
                jars.every { !it.toLowerCase(java.util.Locale.ROOT).startsWith(stem + '-') }
            }
            if (bad || missing) {
                throw new GradleException("${where} jars are ${jars}; unexpected ${bad}; missing ${missing}")
            }
        }
        def assertTexts = { String licenseText, String noticeText, String where ->
            if (normalize(licenseText) != expectedLicense) {
                throw new GradleException("${where} LICENSE does not match the SpacePixels license.")
            }
            if (normalize(noticeText) != expectedNotice) {
                throw new GradleException("${where} NOTICE.txt does not match the repository notice.")
            }
        }
        def archivePaths = { File archive, boolean tar ->
            def paths = []
            (tar ? project.tarTree(archive) : project.zipTree(archive)).visit { details ->
                paths << details.relativePath.pathString.replace('\\', '/')
            }
            paths
        }
        def archiveText = { File archive, String suffix, boolean tar ->
            String match = null
            (tar ? project.tarTree(archive) : project.zipTree(archive)).visit { details ->
                def path = details.relativePath.pathString.replace('\\', '/')
                if (path == suffix || path.endsWith('/' + suffix)) {
                    if (match != null) throw new GradleException("${archive.name} contains more than one ${suffix}")
                    match = details.file.getText('UTF-8')
                }
            }
            if (match == null) throw new GradleException("${archive.name} is missing ${suffix}")
            match
        }

        File installed = installDir.get()
        assertJars(new File(installed, 'lib').listFiles().collect { it.name }, 'installDist')
        assertTexts(new File(installed, 'LICENSE').getText('UTF-8'),
                new File(installed, 'NOTICE.txt').getText('UTF-8'), 'installDist')

        [[zipFile.get().asFile, false], [tarFile.get().asFile, true]].each { pair ->
            File archive = pair[0] as File
            boolean tar = pair[1]
            def jars = archivePaths(archive, tar).findAll { path ->
                int lib = path.lastIndexOf('/lib/')
                lib >= 0 && !path.substring(lib + 5).contains('/') && path.toLowerCase(java.util.Locale.ROOT).endsWith('.jar')
            }.collect { it.substring(it.lastIndexOf('/') + 1) }
            assertJars(jars, archive.name)
            assertTexts(archiveText(archive, 'LICENSE', tar), archiveText(archive, 'NOTICE.txt', tar), archive.name)
        }

        File input = windowsInput.get().asFile
        assertJars(input.listFiles().findAll { it.isFile() && it.name.endsWith('.jar') }.collect { it.name }, 'windows input')
        assertTexts(new File(input, 'LICENSE').getText('UTF-8'), new File(input, 'NOTICE.txt').getText('UTF-8'), 'windows input')
    }
}

// The isolated API consumer build runs when the Central bundle is prepared (bundleCentralPortal), not on every check.
tasks.named('check') {
    dependsOn tasks.named('verifyApiPublication'), tasks.named('verifyDesktopArchive'),
            tasks.named('verifyApplicationDistribution')
}
